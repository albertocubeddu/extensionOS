name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run PR test gate
        if: github.event_name == 'pull_request'
        run: xvfb-run -a pnpm test

      - name: Run release test gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CRX_PUBLIC_KEY: ${{ secrets.CRX_PUBLIC_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          PLASMO_PUBLIC_EXTENSION_OS_API_ENDPOINT: ${{ secrets.PLASMO_PUBLIC_EXTENSION_OS_API_ENDPOINT }}
          PLASMO_PUBLIC_WEBSITE_EXTENSION_OS: ${{ secrets.PLASMO_PUBLIC_WEBSITE_EXTENSION_OS }}
        run: xvfb-run -a pnpm test:release
