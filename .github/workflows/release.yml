name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to release. Leave blank to use package.json."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Resolve release version
        id: meta
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
              echo "::error::Manual releases must run from main."
              exit 1
            fi

            version="${VERSION_INPUT:-$package_version}"
            version="${version#v}"
            tag="v${version}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be SemVer, for example 0.0.27."
            exit 1
          fi

          if [[ "${package_version}" != "${version}" ]]; then
            echo "::error::package.json version (${package_version}) does not match release version (${version})."
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${TAG}")"
            head_sha="$(git rev-parse HEAD)"

            if [[ "${tag_sha}" != "${head_sha}" ]]; then
              echo "::error::Tag ${TAG} already exists at ${tag_sha}, not current main ${head_sha}."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release test gate
        env:
          CRX_PUBLIC_KEY: ${{ secrets.CRX_PUBLIC_KEY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          PLASMO_PUBLIC_EXTENSION_OS_API_ENDPOINT: ${{ secrets.PLASMO_PUBLIC_EXTENSION_OS_API_ENDPOINT }}
          PLASMO_PUBLIC_WEBSITE_EXTENSION_OS: ${{ secrets.PLASMO_PUBLIC_WEBSITE_EXTENSION_OS }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: xvfb-run -a pnpm test:release

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tag }}-chrome-mv3-prod
          path: build/chrome-mv3-prod.zip
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" build/chrome-mv3-prod.zip --clobber
          else
            release_args=(--title "${TAG}" --generate-notes)

            if [[ "${PRERELEASE}" == "true" ]]; then
              release_args+=(--prerelease)
            fi

            gh release create "${TAG}" build/chrome-mv3-prod.zip "${release_args[@]}"
          fi
